<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Workhub data flow</title><desc id="desc">Agents write local records; a requested review sends selected summaries to the configured reviewer.</desc>
<rect width="1280" height="720" fill="#ffffff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"><text x="64" y="80" font-size="36" fill="#171717" font-weight="600" >Local records. Reviews when you ask.</text>
<text x="64" y="128" font-size="22" fill="#666666" font-weight="400" >Record actual work, inspect its evidence, and choose the next step.</text>
<rect x="64" y="194" width="368" height="210" rx="12" fill="#ffffff" stroke="#e8e8e8"/>
<text x="88" y="247" font-size="26" fill="#171717" font-weight="600" >Agents / CLI</text>
<text x="88" y="303" font-size="20" fill="#666666" font-weight="400" >Codex · Z Code · Claude</text>
<text x="88" y="344" font-size="20" fill="#666666" font-weight="400" >Tasks, outputs and checks</text>
<path d="M437 299H451m-7-6 7 6-7 6" fill="none" stroke="#666666" stroke-width="1.5"/><rect x="456" y="194" width="368" height="210" rx="12" fill="#ffffff" stroke="#e8e8e8"/>
<text x="480" y="247" font-size="26" fill="#171717" font-weight="600" >Local records</text>
<text x="480" y="303" font-size="20" fill="#666666" font-weight="400" >Local SQLite storage</text>
<text x="480" y="344" font-size="20" fill="#666666" font-weight="400" >Projects, activity and sources</text>
<path d="M829 299H843m-7-6 7 6-7 6" fill="none" stroke="#666666" stroke-width="1.5"/><rect x="848" y="194" width="368" height="210" rx="12" fill="#ffffff" stroke="#171717"/>
<text x="872" y="247" font-size="26" fill="#171717" font-weight="600" >Workhub workspace</text>
<text x="872" y="303" font-size="20" fill="#666666" font-weight="400" >Sites in one workspace</text>
<text x="872" y="344" font-size="20" fill="#666666" font-weight="400" >Layouts, learning and reviews</text>
<path d="M1032 416V474m-6-7 6 7 6-7" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 5"/><text x="1050" y="452" font-size="17" fill="#666666" font-weight="400" >On request</text>
<rect x="64" y="486" width="760" height="182" rx="10" fill="#fafafa" stroke="#e8e8e8"/>
<text x="88" y="531" font-size="25" fill="#171717" font-weight="600" >Data boundaries</text>
<text x="88" y="577" font-size="20" fill="#666666" font-weight="400" >Keys and command settings stay in the local backend.</text>
<text x="88" y="620" font-size="20" fill="#666666" font-weight="400" >No automatic upload of complete repositories or conversations.</text>
<rect x="848" y="486" width="368" height="182" rx="12" fill="#ffffff" stroke="#e8e8e8"/>
<text x="872" y="531" font-size="26" fill="#171717" font-weight="600" >Selected reviewer</text>
<text x="872" y="577" font-size="20" fill="#666666" font-weight="400" >API · local model · CLI</text>
<text x="872" y="620" font-size="20" fill="#666666" font-weight="400" >Receives selected summaries</text>
</g></svg>

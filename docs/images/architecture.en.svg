<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Workhub: local records, one workspace, reviews on request</title>
  <desc id="description">Agents and CLIs write essential work summaries to local SQLite. Workhub brings project websites, activity and layouts together. Only a requested review sends selected evidence to the configured API, local model or CLI adapter. Credentials stay in the local backend.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#7e8e73"/></marker></defs>
  <rect width="1200" height="400" rx="18" fill="#f7f8f4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft Yahei',sans-serif">
    <text x="38" y="44" font-size="12" letter-spacing="2" fill="#687267">LOCAL FIRST · REQUEST WHEN NEEDED</text>
    <text x="38" y="79" font-size="24" font-weight="600" fill="#252b26">Your work stays local. You choose how it gets reviewed.</text>
    <rect x="38" y="123" width="188" height="159" rx="10" fill="#fff" stroke="#e1e5dc"/>
    <text x="59" y="159" font-size="16" font-weight="600" fill="#252b26">Agent / CLI</text>
    <text x="59" y="188" font-size="12" fill="#687267">Codex · Z Code · Claude</text>
    <text x="59" y="214" font-size="12" fill="#687267">AGENTS / CLAUDE / skill</text>
    <text x="59" y="253" font-size="12" fill="#53634d">Work summaries + run-id</text>
    <path d="M228 201H268" stroke="#7e8e73" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="280" y="123" width="204" height="159" rx="10" fill="#fff" stroke="#e1e5dc"/>
    <text x="301" y="159" font-size="16" font-weight="600" fill="#252b26">Local work records</text>
    <text x="301" y="188" font-size="12" fill="#687267">SQLite persistence</text>
    <text x="301" y="214" font-size="12" fill="#687267">Projects · events · sites · reviews</text>
    <text x="301" y="253" font-size="12" fill="#53634d">No automatic repo or chat upload</text>
    <path d="M487 201H527" stroke="#7e8e73" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="539" y="123" width="270" height="159" rx="10" fill="#252b26"/>
    <text x="560" y="159" font-size="16" font-weight="600" fill="#fff">One Workhub workspace</text>
    <text x="560" y="188" font-size="12" fill="#c6d0be">Embedded project sites · Agent activity</text>
    <text x="560" y="214" font-size="12" fill="#c6d0be">One design system / three layouts</text>
    <text x="560" y="253" font-size="12" fill="#d6e5c8">Socratic questions · evidence · next steps</text>
    <path d="M812 201H866" stroke="#7e8e73" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="819" y="182" font-size="10" fill="#687267">On request</text>
    <rect x="879" y="123" width="283" height="159" rx="10" fill="#fff" stroke="#e1e5dc"/>
    <text x="900" y="159" font-size="16" font-weight="600" fill="#252b26">Your selected reviewer</text>
    <text x="900" y="188" font-size="12" fill="#687267">GLM / OpenAI-compatible / Anthropic</text>
    <text x="900" y="214" font-size="12" fill="#687267">Ollama / configured CLI adapters</text>
    <text x="900" y="253" font-size="12" fill="#53634d">Network use follows your configuration</text>
    <rect x="38" y="310" width="1124" height="53" rx="9" fill="#edf1e9" stroke="#e1e5dc"/>
    <circle cx="61" cy="336" r="4" fill="#53634d"/>
    <text x="77" y="341" font-size="12" fill="#53634d">Keys and command settings stay in the local backend. The isolated demo uses fictional evidence and makes no model calls.</text>
  </g>
</svg>
